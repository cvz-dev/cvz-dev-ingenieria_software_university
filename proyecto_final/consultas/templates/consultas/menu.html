<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Menú de Consultas</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

    <div class="container py-5">
        <div class="row justify-content-center">
            <div class="col-md-8 col-lg-6">
                
                <div class="card shadow-sm border-0">
                    <div class="card-header bg-primary text-white text-center py-3">
                        <h2 class="h4 mb-0">Menú de Consultas</h2>
                    </div>
                    
                    <div class="list-group list-group-flush p-3">
                        <a href="{% url 'consulta1' %}" class="list-group-item list-group-item-action rounded mb-2 border">
                            <i class="bi bi-arrow-right-circle"></i> 1. Prerrequisitos de un Curso
                        </a>

                        <a href="{% url 'consulta2' %}" class="list-group-item list-group-item-action rounded mb-2 border">
                            <i class="bi bi-person-lines-fill"></i> 2. Transcript de un Estudiante
                        </a>
                        
                        <a href="{% url 'consulta3' %}" class="list-group-item list-group-item-action rounded mb-2 border">
                            <i class="bi bi-person-lines-fill"></i> 3. Estudiante y asesor
                        </a>

                        <a href="{% url 'consulta4' %}" class="list-group-item list-group-item-action rounded mb-2 border">
                            <i class="bi bi-journal-check"></i> 4. Estudiantes con nota 'A'
                        </a>

                         <a href="{% url 'consulta5' %}" class="list-group-item list-group-item-action rounded mb-2 border">
                            <i class="bi bi-person-video3"></i> 5. Cursos de un Profesor
                        </a>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
